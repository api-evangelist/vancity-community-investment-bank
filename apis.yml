name: Vancity Community Investment Bank
kind: company
description: >-
  Vancity Community Investment Bank (VCIB) is a federally regulated Schedule I
  chartered bank headquartered in Toronto, Ontario, and a wholly owned
  subsidiary of Vancouver City Savings Credit Union (Vancity), Canada's largest
  community credit union. Established to carry the cooperative "community-first"
  finance model into the national banking system, VCIB is a values-driven,
  Certified B Corporation and CDIC member that provides impact-focused
  commercial banking - commercial real estate and affordable-housing lending,
  clean-energy and green-building finance, social-enterprise banking, Impact
  GICs, high-interest savings, and business Visa products - to organizations
  driving social, economic, and environmental change. As a small
  impact/commercial bank rather than one of the Big Six, VCIB operates no
  public developer portal, exposes no first-party developer API, and publishes
  no downloadable API specifications. Canada's Consumer-Driven Banking (open
  banking) framework, legislated in Budget 2024 and the 2024 Fall Economic
  Statement under the Financial Consumer Agency of Canada, is not yet
  operational, so any third-party access to VCIB customer data today would be
  voluntary and aggregator-mediated rather than via a documented open API.
